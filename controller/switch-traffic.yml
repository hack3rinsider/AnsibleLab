---
- hosts: lb
  become: yes

  tasks:

    - name: Deploy nginx config
      template:
        src: /ansible/templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
        unsafe_writes: true

    - name: Reload nginx
      shell: nginx -s reload

    - name: Wait for nginx
      pause:
        seconds: 3

    - name: Verify active backend
      shell: curl -sk https://localhost/api/
      register: health_check

    - name: Show health check result
      debug:
        var: health_check.stdout

    - name: Fail if backend is not responding correctly
      fail:
        msg: "Traffic switch failed. Backend response invalid."
      when:
        - "'BLUE' not in health_check.stdout"
        - "'GREEN' not in health_check.stdout"
